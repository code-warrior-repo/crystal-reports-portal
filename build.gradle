plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.company'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.8.0.25.04'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    // Put approved SAP Crystal Reports runtime jars in lib/crystal.
    // The reflection adapter keeps this starter compilable before those jars are added.
    implementation fileTree(dir: 'lib/crystal', include: ['*.jar'])

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

war {
    archiveFileName = 'crystal-reports-portal.war'
}
